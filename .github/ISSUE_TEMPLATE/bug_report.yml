name: Bug report
description: Report a reproducible defect in the repository or implementation.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, inputs, wave/commit, and smallest reproducible case.
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requirement / ADR
      description: Relevant REQ/ADR IDs if known.
