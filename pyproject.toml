[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aggie-analytics-engine"
version = "0.25.0.dev25"
description = "Local-first Texas A&M-centered college-football forecasting research and engineering project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
product = ["fastapi==0.142.1", "uvicorn==0.54.0"]
openai-assist = ["openai==3.22.1"]
data = [
  "duckdb==1.5.6",
  "polars==1.44.2",
  "pandera[polars]==0.33.1",
]
entity-resolution = [
  "rapidfuzz==3.14.6",
  "splink==5.0.0",
]
source-clients = [
  "cfbd==5.31.2",
  "openmeteo-requests==1.7.5",
]
sportsdataverse = [
  "sportsdataverse==0.1.4",
  "xgboost==3.2.0",
  "scikit-learn==1.9.1",
  "polars==1.44.2",
  "rapidfuzz==3.14.6",
]
modeling = [
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "xgboost==3.2.0",
  "ngboost==0.5.11",
  "interpret==0.7.8",
]
evaluation = [
  "mapie==1.5.0",
  "scoringrules==0.10.0",
  "shap==0.51.0",
]
experimentation = [
  "mlflow-skinny==3.16.1",
  "optuna==5.0.0",
]
# Unmounted source-time fixtures write real Parquet inputs.
test = ["hypothesis==6.168.3", "polars==1.44.2", "duckdb==1.5.6"]
# Windows has no system IANA database; contest-local dates require this data.
kernel = ["numpy==2.4.6", "tzdata==2026.4"]

[project.scripts]
bas-staff-query = "aggie_analytics.cycle33.query:main"
bas-national-population-query = "aggie_analytics.national_population.query:main"
bas-national-history-query = "aggie_analytics.national_history.query:main"
bas-source-time-query = "aggie_analytics.national_source_time.query:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aggie_analytics.cycle30" = ["schemas/*.json"]

[tool.unittest]
# Tests intentionally use the Python standard library during early waves.
