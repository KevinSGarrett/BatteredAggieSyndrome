<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-labelledby="title desc">
  <title id="title">BAS shortfall severity spectrum — mobile</title>
  <desc id="desc">A vertical severity ladder marks Texas A&amp;M shortfalls at 3, 7, 14, and 21 points.</desc>
  <defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D6D3C4"/><stop offset="0.4" stop-color="#A86A6A"/><stop offset="0.72" stop-color="#7D2020"/><stop offset="1" stop-color="#500000"/></linearGradient></defs>
  <rect width="720" height="700" rx="28" fill="#F8F7F3"/>
  <text x="48" y="58" fill="#500000" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2.2">BAS · PROTECTED SEVERITY LADDER</text>
  <text x="48" y="96" fill="#1B1B1B" font-family="Consolas, monospace" font-size="16">shortfall = expected margin − actual margin</text>
  <rect x="104" y="140" width="18" height="448" rx="9" fill="url(#bar)"/>
  <g fill="#500000" stroke="#FFFFFF" stroke-width="4"><circle cx="113" cy="200" r="12"/><circle cx="113" cy="310" r="12"/><circle cx="113" cy="430" r="12"/><circle cx="113" cy="550" r="12"/></g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="160" y="198" fill="#500000" font-size="20" font-weight="800">3+ · MILD</text><text x="160" y="222" fill="#707070" font-size="13">small expectation-relative shortfall</text>
    <text x="160" y="308" fill="#500000" font-size="20" font-weight="800">7+ · HEADLINE</text><text x="160" y="332" fill="#707070" font-size="13">the primary BAS event threshold</text>
    <text x="160" y="428" fill="#500000" font-size="20" font-weight="800">14+ · SEVERE</text><text x="160" y="452" fill="#707070" font-size="13">large tail underperformance</text>
    <text x="160" y="548" fill="#500000" font-size="20" font-weight="800">21+ · EXTREME</text><text x="160" y="572" fill="#707070" font-size="13">the far end of the protected ladder</text>
  </g>
  <text x="48" y="635" fill="#707070" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Interpretive labels only. The thresholds are governance-protected.</text>
  <text x="48" y="657" fill="#707070" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">The model does not train on folklore.</text>
</svg>
