[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aggie-analytics-engine"
version = "0.25.0.dev25"
description = "Local-first Texas A&M-centered college-football forecasting research and engineering project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
product = ["fastapi==0.128.2", "uvicorn==0.48.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
# Tests intentionally use the Python standard library during early waves.
