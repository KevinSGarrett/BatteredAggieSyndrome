name: codex-scientific-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codex-review-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Paid review is opt-in and not run on every push
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path("artifacts/scientific_integrity").mkdir(parents=True, exist_ok=True)
          payload = {
              "verdict": "SKIPPED_UNTIL_PAID_SCIENTIFIC_REVIEW_READY",
              "paid_review_on_every_push": False,
              "default_model": "gpt-5.3-codex",
              "default_effort": "low",
              "automatic_premium_models": False,
              "authorization_label": "paid-scientific-review-ready",
              "workflow": ".github/workflows/paid-scientific-review.yml",
          }
          Path("artifacts/scientific_integrity/codex_scientific_review_skip.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(payload, indent=2))
          PY
