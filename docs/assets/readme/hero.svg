<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Battered Aggie Syndrome — The Aggie Analytics Engine</title>
  <desc id="desc">A maroon data visualization banner for a point-in-time college-football forecasting research engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160707"/>
      <stop offset="0.54" stop-color="#500000"/>
      <stop offset="1" stop-color="#250606"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D6D3C4" stop-opacity="0.1"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#FCE300" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FCE300" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FCE300" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="145" r="250" fill="url(#glow)"/>

  <g opacity="0.18" stroke="#FFFFFF" stroke-width="2">
    <path d="M0 447H1200"/>
    <path d="M120 435V459M220 435V459M320 435V459M420 435V459M520 435V459M620 435V459M720 435V459M820 435V459M920 435V459M1020 435V459M1120 435V459"/>
  </g>

  <g transform="translate(64 68)">
    <rect width="86" height="86" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.28"/>
    <path d="M21 58L43 20L65 58H55L50 48H36L31 58ZM40 39H47L43.5 31Z" fill="#FFFFFF"/>
    <path d="M18 66H68" stroke="#FCE300" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="64" y="198" fill="#D6D3C4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">THE AGGIE ANALYTICS ENGINE</text>
  <text x="64" y="262" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="53" font-weight="800">Battered Aggie</text>
  <text x="64" y="320" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="53" font-weight="800">Syndrome</text>
  <rect x="64" y="343" width="182" height="5" rx="2.5" fill="#FCE300"/>
  <text x="64" y="387" fill="#FFFFFF" fill-opacity="0.84" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">College football. Point-in-time truth.</text>
  <text x="64" y="416" fill="#FFFFFF" fill-opacity="0.84" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20">Probabilistic answers.</text>

  <g transform="translate(758 70)" filter="url(#shadow)">
    <rect width="378" height="346" rx="24" fill="#120A0A" fill-opacity="0.84" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="31" cy="31" r="5" fill="#FCE300"/>
    <text x="49" y="37" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">PREGAME SIGNAL</text>
    <text x="28" y="82" fill="#D6D3C4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" letter-spacing="1.4">COHERENT FORECAST DISTRIBUTION</text>

    <path d="M30 218 C74 212 87 183 119 189 S170 230 202 186 S265 129 344 111" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 218 C74 212 87 183 119 189 S170 230 202 186 S265 129 344 111 L344 248 L30 248Z" fill="#500000" fill-opacity="0.26"/>
    <path d="M30 248H344" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <circle cx="202" cy="186" r="7" fill="#FCE300" stroke="#FFFFFF" stroke-width="3"/>

    <g transform="translate(28 275)">
      <rect width="96" height="43" rx="11" fill="#FFFFFF" fill-opacity="0.07"/>
      <text x="48" y="18" text-anchor="middle" fill="#D6D3C4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10">WIN</text>
      <text x="48" y="34" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, monospace" font-size="14" font-weight="700">P(W)</text>
    </g>
    <g transform="translate(140 275)">
      <rect width="96" height="43" rx="11" fill="#FFFFFF" fill-opacity="0.07"/>
      <text x="48" y="18" text-anchor="middle" fill="#D6D3C4" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10">MARGIN</text>
      <text x="48" y="34" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, monospace" font-size="14" font-weight="700">E[M]</text>
    </g>
    <g transform="translate(252 275)">
      <rect width="96" height="43" rx="11" fill="#FCE300" fill-opacity="0.13" stroke="#FCE300" stroke-opacity="0.35"/>
      <text x="48" y="18" text-anchor="middle" fill="#FCE300" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10">BAS</text>
      <text x="48" y="34" text-anchor="middle" fill="#FFFFFF" font-family="Consolas, monospace" font-size="14" font-weight="700">Δ</text>
    </g>
  </g>

  <g transform="translate(64 474)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.1">
    <text fill="#D6D3C4">LOCAL-FIRST</text>
    <circle cx="112" cy="-4" r="3" fill="#FCE300"/>
    <text x="128" fill="#D6D3C4">PIT-SAFE</text>
    <circle cx="210" cy="-4" r="3" fill="#FCE300"/>
    <text x="226" fill="#D6D3C4">NATIONAL → A&amp;M</text>
    <circle cx="372" cy="-4" r="3" fill="#FCE300"/>
    <text x="388" fill="#D6D3C4">NULL RESULTS WELCOME</text>
  </g>
</svg>
