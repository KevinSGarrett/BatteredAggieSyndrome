name: Bug report
description: Report a reproducible software, data-processing, or documentation defect.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic or redistribution-permitted examples. Do not include credentials, private tracker exports, personal information, or bulk provider responses. For sensitive security reports, see SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands, a small permitted example, and the commit tested. Redact unnecessary local-machine details.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system.
  - type: textarea
    id: scientific_scope
    attributes:
      label: Scientific scope, if relevant
      description: Which input, cutoff, population, metric, or output is affected? Distinguish a suspected issue from a verified result.
