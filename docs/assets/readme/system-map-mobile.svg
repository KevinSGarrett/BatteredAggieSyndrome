<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">Aggie Analytics Engine mobile system map</title>
  <desc id="desc">Seven vertically arranged stages connect immutable source capture to published forecast snapshots over a provenance spine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8F7F3"/><stop offset="1" stop-color="#EEEAE2"/></linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#500000"/><stop offset="1" stop-color="#8A3030"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#500000"/></marker>
  </defs>
  <rect width="720" height="1080" rx="28" fill="url(#bg)"/>
  <text x="360" y="54" text-anchor="middle" fill="#500000" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="3">FROM EVIDENCE TO EXPECTATION</text>
  <g stroke="#500000" stroke-width="3" marker-end="url(#arrow)">
    <path d="M360 180V205"/><path d="M360 302V327"/><path d="M360 424V449"/><path d="M360 546V571"/><path d="M360 668V693"/><path d="M360 790V815"/>
  </g>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <g transform="translate(100 84)"><rect width="520" height="96" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/><circle cx="48" cy="48" r="23" fill="#500000"/><text x="48" y="54" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">01</text><text x="92" y="41" fill="#1B1B1B" font-size="18" font-weight="800">CAPTURE</text><text x="92" y="66" fill="#707070" font-size="13">immutable source evidence</text></g>
    <g transform="translate(100 206)"><rect width="520" height="96" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/><circle cx="48" cy="48" r="23" fill="#500000"/><text x="48" y="54" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">02</text><text x="92" y="41" fill="#1B1B1B" font-size="18" font-weight="800">RESOLVE</text><text x="92" y="66" fill="#707070" font-size="13">canonical team, game, and player identity</text></g>
    <g transform="translate(100 328)"><rect width="520" height="96" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/><circle cx="48" cy="48" r="23" fill="#500000"/><text x="48" y="54" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">03</text><text x="92" y="41" fill="#1B1B1B" font-size="18" font-weight="800">REPLAY</text><text x="92" y="66" fill="#707070" font-size="13">point-in-time state before kickoff</text></g>
    <g transform="translate(100 450)"><rect width="520" height="96" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/><circle cx="48" cy="48" r="23" fill="#500000"/><text x="48" y="54" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">04</text><text x="92" y="41" fill="#1B1B1B" font-size="18" font-weight="800">MODEL</text><text x="92" y="66" fill="#707070" font-size="13">interpretable baseline → bounded challenger</text></g>
    <g transform="translate(100 572)"><rect width="520" height="96" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/><circle cx="48" cy="48" r="23" fill="#500000"/><text x="48" y="54" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">05</text><text x="92" y="41" fill="#1B1B1B" font-size="18" font-weight="800">CALIBRATE</text><text x="92" y="66" fill="#707070" font-size="13">coherent win, score, margin, and uncertainty</text></g>
    <g transform="translate(100 694)"><rect width="520" height="96" rx="18" fill="#500000"/><circle cx="48" cy="48" r="23" fill="#FFFFFF" fill-opacity="0.14"/><text x="48" y="54" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">06</text><text x="92" y="41" fill="#FFFFFF" font-size="18" font-weight="800">SPECIALIZE</text><text x="92" y="66" fill="#FFFFFF" fill-opacity="0.74" font-size="13">Texas A&amp;M layer vs. no-adjustment reference</text></g>
    <g transform="translate(100 816)"><rect width="520" height="96" rx="18" fill="#1B1B1B"/><circle cx="48" cy="48" r="23" fill="#FCE300"/><text x="48" y="54" text-anchor="middle" fill="#1B1B1B" font-size="15" font-weight="800">07</text><text x="92" y="41" fill="#FFFFFF" font-size="18" font-weight="800">PUBLISH</text><text x="92" y="66" fill="#FFFFFF" fill-opacity="0.74" font-size="13">immutable forecast snapshots</text></g>
  </g>
  <rect x="44" y="954" width="632" height="82" rx="18" fill="url(#spine)"/>
  <text x="72" y="985" fill="#FCE300" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2">EVIDENCE SPINE</text>
  <text x="72" y="1012" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">hashes · provenance · known-at gates · leakage tests · chronology</text>
</svg>
