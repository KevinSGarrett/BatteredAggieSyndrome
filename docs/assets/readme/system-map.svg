<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Aggie Analytics Engine system map</title>
  <desc id="desc">Seven stages connect immutable source capture to published forecast snapshots over a provenance and validation spine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F7F3"/>
      <stop offset="1" stop-color="#EEEAE2"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#500000"/>
      <stop offset="1" stop-color="#8A3030"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#500000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#500000"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <text x="600" y="53" text-anchor="middle" fill="#500000" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="3">FROM EVIDENCE TO EXPECTATION</text>

  <g stroke="#500000" stroke-width="3" marker-end="url(#arrow)">
    <path d="M173 163H199"/>
    <path d="M335 163H361"/>
    <path d="M497 163H523"/>
    <path d="M659 163H685"/>
    <path d="M821 163H847"/>
    <path d="M983 163H1009"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(37 100)">
      <rect width="136" height="126" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/>
      <circle cx="68" cy="34" r="18" fill="#500000"/><text x="68" y="40" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">01</text>
      <text x="68" y="78" text-anchor="middle" fill="#1B1B1B" font-size="16" font-weight="800">CAPTURE</text>
      <text x="68" y="101" text-anchor="middle" fill="#707070" font-size="11">immutable sources</text>
    </g>
    <g transform="translate(199 100)">
      <rect width="136" height="126" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/>
      <circle cx="68" cy="34" r="18" fill="#500000"/><text x="68" y="40" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">02</text>
      <text x="68" y="78" text-anchor="middle" fill="#1B1B1B" font-size="16" font-weight="800">RESOLVE</text>
      <text x="68" y="101" text-anchor="middle" fill="#707070" font-size="11">canonical identity</text>
    </g>
    <g transform="translate(361 100)">
      <rect width="136" height="126" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/>
      <circle cx="68" cy="34" r="18" fill="#500000"/><text x="68" y="40" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">03</text>
      <text x="68" y="78" text-anchor="middle" fill="#1B1B1B" font-size="16" font-weight="800">REPLAY</text>
      <text x="68" y="101" text-anchor="middle" fill="#707070" font-size="11">point-in-time state</text>
    </g>
    <g transform="translate(523 100)">
      <rect width="136" height="126" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/>
      <circle cx="68" cy="34" r="18" fill="#500000"/><text x="68" y="40" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">04</text>
      <text x="68" y="78" text-anchor="middle" fill="#1B1B1B" font-size="16" font-weight="800">MODEL</text>
      <text x="68" y="101" text-anchor="middle" fill="#707070" font-size="11">baseline → challenger</text>
    </g>
    <g transform="translate(685 100)">
      <rect width="136" height="126" rx="18" fill="#FFFFFF" stroke="#D6D3C4"/>
      <circle cx="68" cy="34" r="18" fill="#500000"/><text x="68" y="40" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">05</text>
      <text x="68" y="78" text-anchor="middle" fill="#1B1B1B" font-size="16" font-weight="800">CALIBRATE</text>
      <text x="68" y="101" text-anchor="middle" fill="#707070" font-size="11">coherent forecasts</text>
    </g>
    <g transform="translate(847 100)">
      <rect width="136" height="126" rx="18" fill="#500000" stroke="#500000"/>
      <circle cx="68" cy="34" r="18" fill="#FFFFFF" fill-opacity="0.14"/><text x="68" y="40" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">06</text>
      <text x="68" y="78" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">SPECIALIZE</text>
      <text x="68" y="101" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.72" font-size="11">Texas A&amp;M layer</text>
    </g>
    <g transform="translate(1009 100)">
      <rect width="154" height="126" rx="18" fill="#1B1B1B" stroke="#1B1B1B"/>
      <circle cx="77" cy="34" r="18" fill="#FCE300"/><text x="77" y="40" text-anchor="middle" fill="#1B1B1B" font-size="15" font-weight="800">07</text>
      <text x="77" y="78" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="800">PUBLISH</text>
      <text x="77" y="101" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.72" font-size="11">immutable snapshots</text>
    </g>
  </g>

  <rect x="37" y="277" width="1126" height="74" rx="18" fill="url(#spine)"/>
  <text x="69" y="307" fill="#FCE300" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2">EVIDENCE SPINE</text>
  <text x="69" y="333" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15">content hashes · source provenance · schema contracts · known-at gates · leakage tests · chronological evaluation</text>
  <circle cx="1119" cy="314" r="17" fill="#FFFFFF" fill-opacity="0.13"/>
  <path d="M1111 314L1117 320L1128 307" fill="none" stroke="#FCE300" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
