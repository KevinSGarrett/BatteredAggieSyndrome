[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aggie-analytics-engine"
version = "0.25.0.dev25"
description = "Local-first Texas A&M-centered college-football forecasting research and engineering project."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
product = ["fastapi==0.142.1", "uvicorn==0.54.0"]
openai-assist = ["openai==2.53.0"]
data = [
  "duckdb==1.5.5",
  "polars==1.43.2",
  "pandera[polars]==0.32.1",
]
entity-resolution = [
  "rapidfuzz==3.14.5",
  "splink==4.0.16",
]
source-clients = [
  "cfbd==5.23.0",
  "openmeteo-requests==1.7.5",
]
sportsdataverse = [
  "sportsdataverse==0.0.75",
  "xgboost==3.2.0",
  "scikit-learn==1.9.0",
  "polars==1.43.2",
  "rapidfuzz==3.14.5",
]
modeling = [
  "scikit-learn==1.9.0",
  "statsmodels==0.14.6",
  "xgboost==3.2.0",
  "ngboost==0.5.11",
  "interpret==0.7.8",
]
evaluation = [
  "mapie==1.5.0",
  "scoringrules==0.10.0",
  "shap==0.51.0",
]
experimentation = [
  "mlflow-skinny==3.15.1",
  "optuna==4.9.0",
]
# Unmounted source-time fixtures write real Parquet inputs.
test = ["hypothesis==6.165.2", "polars==1.43.2", "duckdb==1.5.5"]
# Windows has no system IANA database; contest-local dates require this data.
kernel = ["numpy==2.2.6", "tzdata==2025.3"]

[project.scripts]
bas-history-availability-query = "aggie_analytics.national_history.availability_query:main"
bas-staff-query = "aggie_analytics.cycle33.query:main"
bas-national-population-query = "aggie_analytics.national_population.query:main"
bas-national-history-query = "aggie_analytics.national_history.query:main"
bas-source-time-query = "aggie_analytics.national_source_time.query:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aggie_analytics.cycle30" = ["schemas/*.json"]
# BAT-713: the exact issued 2019 archive tranche bytes the archive-evidence consumer binds (contract V1.2 scope).
# BAT-715: the exact issued 2019 missing-prior cohort bytes the expansion consumer binds (expansion contract scope).
"aggie_analytics.national_source_time" = ["national_archived_publication_2019_tranche.json",
                                          "national_archived_publication_2019_expansion_cohort.json"]

[tool.unittest]
# Tests intentionally use the Python standard library during early waves.
